spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/drenix_identity}
    username: ${DB_USER:identity_app}
    password: ${DB_PASSWORD}          # no default: refuse to start without it
    hikari:
      maximum-pool-size: 16
      leak-detection-threshold: 20000
  jpa:
    open-in-view: false               # keeps lazy loading out of the gRPC response path
    hibernate:
      ddl-auto: validate              # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

# HTTP here serves the actuator only. The API is gRPC.
server:
  port: 9091
  address: 127.0.0.1

drenix:
  grpc:
    port: ${GRPC_PORT:9090}
    tls-enabled: ${GRPC_TLS_ENABLED:true}
    certificate: ${TLS_CERT_PATH:/etc/drenix/tls/user-service.crt}
    private-key: ${TLS_KEY_PATH:/etc/drenix/tls/user-service.key}
    ca: ${TLS_CA_PATH:/etc/drenix/tls/internal-ca.crt}
    allowed-peers: ${GRPC_ALLOWED_PEERS:edge-gateway,auth-service,notification-service,performance-service}
    jwks-uri: ${JWKS_URI:https://auth-service:9443/.well-known/jwks.json}
    issuer: ${TOKEN_ISSUER:https://auth.drenix.uz}
    audience: ${TOKEN_AUDIENCE:drenix-internal}
  security:
    lockout:
      max-attempts: 5
      duration: PT15M

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never             # health detail is a free inventory of internal hosts

logging:
  level:
    root: INFO
    uz.drenix: DEBUG
