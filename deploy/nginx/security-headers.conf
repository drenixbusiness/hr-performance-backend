# Install as /etc/nginx/snippets/drenix-security-headers.conf
#
# WHY THIS IS A FILE AND NOT FOUR LINES IN THE SERVER BLOCK.
#
# nginx's add_header is inherited by a location only if that location declares no add_header of
# its own. One `add_header Cache-Control "no-store"` inside `location /api/` silently drops every
# header set at the server level — HSTS, nosniff, the referrer policy, all of them — for exactly
# the paths that carry the tokens and the reports. The headers are still visible on the frontend,
# so the mistake looks fine in a browser and only shows up in a header dump of an API call.
#
# So they live here and every location that adds a header of its own includes this first.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
