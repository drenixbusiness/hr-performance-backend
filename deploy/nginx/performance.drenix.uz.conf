# performance.drenix.uz — the only thing on this server that accepts public traffic.
#
# Install as /etc/nginx/sites-available/performance.drenix.uz and symlink into sites-enabled.
# The rate-limit zones below must live in the http{} block, so they are in a separate file:
# deploy/nginx/drenix-limits.conf -> /etc/nginx/conf.d/drenix-limits.conf
#
#   Internet ──443──> nginx ──┬── /       ──> frontend  (127.0.0.1:3000)
#                             └── /api/   ──> gateway   (127.0.0.1:8443)
#
# Host nginx rather than a container, deliberately. Certbot's nginx plugin edits this file and
# reloads the service in place, which is the least error-prone renewal path there is; in a
# container it becomes a volume-mount and a reload-signal problem solved freshly on every server.
# nginx also has to serve the frontend, which is built by a different repository — the host is
# where those two things meet.

# ---------------------------------------------------------------------------
# 1. Plain HTTP. Certbot's challenge, and a redirect for everything else.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name performance.drenix.uz;

    # Let's Encrypt writes its HTTP-01 token here. It must stay reachable on port 80 forever,
    # not just at first issue: renewal repeats the same challenge every sixty days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name performance.drenix.uz;

    # Certbot fills these in. Until it has run, this server block will not load — see the
    # bootstrap note in docs/DEPLOYMENT.md, which starts nginx on port 80 alone.
    ssl_certificate     /etc/letsencrypt/live/performance.drenix.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/performance.drenix.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/performance.drenix.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLS 1.3 orders its own; 1.2 clients pick sensibly
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/performance.access.log;
    error_log  /var/log/nginx/performance.error.log warn;

    # The monthly report PDF is generated, not uploaded, and nothing here accepts a large body.
    # 2MB is generous for the largest JSON this API takes and small enough to be uninteresting
    # to somebody trying to fill the disk.
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # ---------------------------------------------------------------- headers
    #
    # Set here so they cover the frontend as well as the API. HSTS is two years with subdomains:
    # do that only once every subdomain of drenix.uz will have a certificate, because it is not
    # quickly reversible.
    #
    # Every location below that sets a header of its own includes this file again. nginx does not
    # merge add_header across levels — it replaces — so one add_header in a location drops all of
    # these for that location. See the snippet's own comment.
    include snippets/drenix-security-headers.conf;
    # No Content-Security-Policy at this level. The frontend is built by another repository and a
    # policy written blind would break it on the first inline script; the API sets its own strict
    # one already. Add a CSP for the frontend once its asset origins are known — see
    # docs/DEPLOYMENT.md.

    # Do not advertise the version. It is not security, but it removes this host from the results
    # of somebody scanning for one known-vulnerable nginx build.
    server_tokens off;

    # ------------------------------------------------------------- forbidden
    #
    # Nothing below here should exist under a document root, but a mis-copied deployment is
    # exactly how .env ends up served as text/plain.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(env|ini|log|bak|backup|swp|sql|sqlite|db|pem|key|p12|jks|yml|yaml|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* /(\.git|\.svn|\.hg|node_modules|vendor)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------------- API
    #
    # NOTE ON THE TRAILING SLASH. The backend already serves its routes under /api — the real
    # paths are /api/v1/auth/login, /api/health and so on. So this must pass the URI through
    # unchanged:
    #
    #     proxy_pass http://drenix_backend;      correct: /api/v1/x  ->  /api/v1/x
    #     proxy_pass http://drenix_backend/;     WRONG:   /api/v1/x  ->  /v1/x
    #
    # There is no trailing slash below, and there must never be one.
    location /api/ {
        limit_req zone=drenix_api burst=40 nodelay;
        limit_conn drenix_conn 40;

        proxy_pass http://drenix_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # The gateway reads the left-most X-Forwarded-For entry as the client. A client that sent
        # its own header would otherwise choose the address the rate limiter counts against, and
        # the address written into the audit log.
        proxy_set_header X-Real-IP $remote_addr;

        # Generating a monthly PDF calls a language model and can take two minutes. The read
        # timeout has to clear the backend's own 180s ceiling or nginx gives up first and the
        # user sees a 504 for a request that was about to succeed.
        proxy_connect_timeout 10s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;

        # A report is a stream, not a page. Buffering it means the browser waits for the whole
        # PDF before the download begins.
        proxy_buffering off;
        proxy_request_buffering off;

        # Never cache an API response. Every one of them is scoped to the caller's permissions,
        # and a shared cache is how one company's report reaches the other company's lead.
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        include snippets/drenix-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Authentication endpoints get their own, much tighter limit. Brute force is the attack this
    # exists for, and no honest client signs in ten times a second. The application applies its
    # own limit as well — five failures locks the account for fifteen minutes — so this is the
    # outer of two layers, not the only one.
    location = /api/v1/auth/login {
        limit_req zone=drenix_auth burst=5 nodelay;
        limit_conn drenix_conn 10;

        proxy_pass http://drenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        include snippets/drenix-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/auth/password {
        limit_req zone=drenix_auth burst=5 nodelay;
        proxy_pass http://drenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        include snippets/drenix-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Liveness. No rate limit: an uptime monitor polling every ten seconds must not be throttled
    # into reporting an outage that is not happening.
    location = /api/health {
        proxy_pass http://drenix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # The API documentation, if it is ever switched on. Blocked here as well, so turning
    # API_DOCS_ENABLED back on by accident does not immediately publish the endpoint map.
    location ~ ^/(v3/api-docs|swagger-ui) {
        deny all;
    }

    # -------------------------------------------------------------- frontend
    #
    # Everything that is not /api. The SPA owns /, /login, /admin and every other route it
    # invents, and none of them must reach the backend — which is why /api/ is matched by a
    # prefix that sorts ahead of this one.
    #
    # /admin is a frontend route and nothing more. It is not a security boundary: the backend
    # authorizes every privileged call on its own, and a person who types the URL without the
    # permissions sees an empty screen and gets 403 from every request behind it.
    location / {
        proxy_pass http://drenix_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js and Vite both use a websocket in development, and some frameworks keep one in
        # production for streaming. Harmless when unused.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Hashed build assets are immutable: the filename changes when the content does. A year of
    # caching costs nothing and saves every repeat visitor the download.
    location ~* ^/(_next/static|assets|static)/ {
        proxy_pass http://drenix_frontend;
        proxy_set_header Host $host;
        include snippets/drenix-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
}
