# Install as /etc/nginx/conf.d/drenix-limits.conf
#
# These directives are only valid inside http{}, which is why they are not in the server block
# that uses them. conf.d is included from http{} by the stock Debian and Ubuntu nginx.conf.
#
# Two upstreams and three shared zones. Nothing here is specific to one site, so a second site on
# this host can use the same zones.

# ---------------------------------------------------------------------------
# Upstreams. Both bound to loopback: neither service accepts a connection from
# anywhere but this machine, so nginx is the only possible client.
# ---------------------------------------------------------------------------
upstream drenix_backend {
    server 127.0.0.1:8443;
    keepalive 32;
}

upstream drenix_frontend {
    # CHANGE ME if the frontend listens elsewhere. 3000 is the Next.js and Vite-preview default.
    # If the frontend is a static build served by nginx instead of a process, delete this block
    # and replace the `location /` in the site file with a `root` — see docs/DEPLOYMENT.md.
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Rate limits.
#
# Keyed on $binary_remote_addr, which is the real client because nginx is the
# edge — nothing sits in front of it. 10MB of state holds roughly 160,000
# addresses, far more than this application will ever see.
# ---------------------------------------------------------------------------

# General API traffic. A dashboard loading its panels makes a handful of calls at once, and the
# burst absorbs that; 20/s sustained is well beyond anything a human generates.
limit_req_zone $binary_remote_addr zone=drenix_api:10m rate=20r/s;

# Authentication. One attempt every two seconds, five queued. Brute force needs thousands; this
# turns thousands into days. The application's own lockout — five failures, fifteen minutes — is
# the layer that actually stops the attack; this one stops it from being loud.
limit_req_zone $binary_remote_addr zone=drenix_auth:10m rate=30r/m;

# Concurrent connections per address. A single browser opens six or so; forty is generous and
# still stops one client from holding every worker slot open.
limit_conn_zone $binary_remote_addr zone=drenix_conn:10m;

# Answer a throttled request with 429, not the default 503. 503 says "this server is broken";
# 429 says "you are going too fast", which is both true and the code a client knows to back off on.
limit_req_status 429;
limit_conn_status 429;

# ---------------------------------------------------------------------------
# Websocket upgrade. `Connection` must be "upgrade" only when the client asked
# for one, and "close" otherwise — a literal `Connection: upgrade` on every
# proxied request breaks keepalive.
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Compression. Text only: compressing an already-compressed PDF or image wastes CPU on both ends,
# and gzip over TLS on secret-bearing responses is the shape of the BREACH attack — which is why
# application/json is present but the API also sets no-store, and why nothing here compresses a
# response body the attacker can influence character by character.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# Do not announce the version to every client and every error page.
server_tokens off;
