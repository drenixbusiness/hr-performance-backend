# Dokploy deployment, pulling pre-built images. THIS IS THE ONE TO USE.
#
# Compose path in Dokploy:  ./deploy/docker-compose.registry.yml
#
# Identical to docker-compose.dokploy.yml except that it pulls the five service images from GHCR
# instead of compiling them here. GitHub Actions builds and pushes them on every push to main
# (.github/workflows/build-images.yml), then calls the Dokploy webhook.
#
# WHY. Compiling five Java modules needs about a gigabyte for Maven alone. On this server — 4 CPUs
# and 2 GB shared with Dokploy and the running application — that build pinned the CPU at 92% and
# filled swap. The build is not part of serving traffic; it does not belong on the machine that
# serves it. Here the server only pulls, which is a minute instead of fifteen.
#
# GENERATED FROM docker-compose.dokploy.yml. If you change one, change both — CI validates both,
# so a divergence that breaks either will fail the build rather than the deployment.
#
# THIS FILE REPLACES docker-compose.prod.yml — do not use both. The production overlay publishes
# the gateway on 127.0.0.1:8443 for a host nginx to proxy; under Dokploy there is no host nginx,
# Traefik reaches the container over a Docker network instead, and a published port would be an
# unnecessary second way in.
#
#   Internet ──80/443──> Traefik (Dokploy owns it) ──┬── /api ──> edge-gateway:8443
#                                                    └── /    ──> the frontend app, added later
#
# Everything else stays on the private `drenix-internal` network: the four gRPC services, both
# databases and Redis are unreachable from Traefik and from the host.
#
# WHAT YOU SET IN THE DOKPLOY UI, NOT HERE:
#
#   Domain      host  performance.drenix.uz
#               path  /api
#               port  8443            <- the container port, not a host port
#               service  edge-gateway
#               HTTPS on, certificate Let's Encrypt
#
#   **Leave "Strip Path" OFF.** The backend already serves its routes under /api — the real paths
#   are /api/v1/auth/login and /api/health. Stripping the prefix turns /api/v1/auth/login into
#   /v1/auth/login and every request 404s. This is the single most likely thing to go wrong.
#
#   Environment   everything from .env.example. Dokploy stores these encrypted; they never enter
#                 the repository.
name: drenix-backend

x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      # 5 files of 10MB, not 10 of 20. On a 48GB disk shared with Dokploy's own images and the
      # build cache, 200MB per service of logs is a real slice of it.
      max-size: "10m"
      max-file: "5"

# ---------------------------------------------------------------------------
# THE MEMORY BUDGET.
#
# Measured, not guessed. With no container limit and -XX:MaxRAMPercentage=75, each JVM reads the
# *host's* memory and concludes it may use three quarters of the whole machine. Five of them did
# exactly that: 690, 802, 805, 904 and 909 MiB — 4.2 GiB of a 2 GiB server, which is why swap was
# at 100% and the box was thrashing.
#
# A container limit fixes it at the root: MaxRAMPercentage then reads the *limit*, and the JVM
# sizes itself to what it has actually been given.
#
# Every limit below is an environment variable so you can raise them without editing this file —
# set MEM_GATEWAY, MEM_USER and so on in the Dokploy environment.
#
#   service               limit    heap     why that much
#   ------------------------------------------------------------------------
#   user-service          300m     140m     Argon2id hashing allocates per login
#   auth-service          260m     120m     token signing; almost no allocation
#   notification-service  260m     120m     polls an audit page every minute
#   performance-service   380m     200m     reads 20,000 RingCentral records at once
#   edge-gateway          340m     180m     renders the monthly PDF in memory
#   postgres              160m
#   redis                  48m
#   ------------------------------------------------------------------------
#   total                1748m  =  1.71 GiB
#
# Dokploy itself — its Node app, Traefik, its own Postgres and Redis — needs roughly 500 MiB more,
# and the OS another 150. That is 2.4 GiB on a 2 GiB machine. See docs/OPTIMIZATION.md: this
# configuration is the most that can be squeezed out, and the machine still wants 4 GiB.
# ---------------------------------------------------------------------------

# Flags shared by every JVM. Each service adds its own -Xmx.
#
#   UseSerialGC          G1 keeps region tables, remembered sets and concurrent threads. Below
#                        ~256MB of heap that machinery costs more than it saves, and this load is
#                        ten users, not ten thousand.
#   TieredStopAtLevel=1  C1 only. Drops the C2 compiler and its code cache. Peak throughput falls
#                        and nobody here will notice; startup gets faster and memory falls by tens
#                        of megabytes per process.
#   MaxMetaspaceSize     Spring loads thousands of classes and metaspace grows without a ceiling
#                        by default. It is the largest non-heap consumer in a Boot application.
#   MALLOC_ARENA_MAX=2   glibc gives each thread its own arena; with virtual threads that inflates
#                        RSS badly for memory the process is not really using.
# JVM_COMMON below carries them. It is written out on every service rather than shared through a
# YAML anchor, because an anchor cannot be spliced into the middle of a string — `-Xmx140m *jvm`
# would be the literal text `*jvm`, the flag would be ignored, and the only symptom would be a
# container that quietly uses more memory than it was told to.

x-java-health: &java-health
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 120s

networks:
  # Dokploy creates this. Traefik lives on it, so anything that needs to be reachable from the
  # internet must join it — and nothing else should.
  dokploy-network:
    external: true
  # Everything internal. No route to Traefik, no route to the host.
  drenix-internal:
    driver: bridge

volumes:
  identity-data:
  redis-data:
  # The internal mTLS material. Generated once by the init service below and kept in a volume,
  # because `deploy/tls/` is gitignored — a git-based deploy arrives with no certificates at all,
  # and without them no service can talk to any other.
  internal-tls:

services:
  # ---------------------------------------------------------------------------
  # One-shot: create the private CA and one certificate per service, if they are
  # not already in the volume.
  #
  # The script is idempotent — it skips anything that already exists — so this
  # runs on every deployment and does work only on the first.
  # ---------------------------------------------------------------------------
  tls-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache openssl bash >/dev/null
        bash /scripts/gen-certs.sh /tls
        # The services run as uid 10001 and must be able to read these.
        chown -R 10001:10001 /tls
        chmod 700 /tls
        chmod 600 /tls/*.key
        chmod 644 /tls/*.crt
        echo "internal TLS ready"
    volumes:
      - internal-tls:/tls
      - ../scripts:/scripts:ro
    networks: [drenix-internal]
    restart: "no"

  postgres-identity:
    <<: *prod
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drenix_identity
      POSTGRES_USER: identity_app
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD}
      PERFORMANCE_DB_PASSWORD: ${PERFORMANCE_DB_PASSWORD:?set PERFORMANCE_DB_PASSWORD}
    # Sized for three small databases and about a dozen connections, not for a data warehouse.
    # The stock configuration assumes a machine that exists to be a database server; this one is
    # sharing 2GB with five JVMs and Dokploy.
    command:
      - postgres
      - -c
      - shared_buffers=48MB          # default 128MB
      - -c
      - max_connections=40           # default 100; we use about 14
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=0   # no query here is big enough to be worth a second core
    volumes:
      - identity-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [drenix-internal]
    mem_limit: ${MEM_POSTGRES:-160m}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_app -d drenix_identity"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    <<: *prod
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-32mb}
      --maxmemory-policy noeviction
      --save ""
    volumes:
      - redis-data:/data
    networks: [drenix-internal]
    # It holds sessions, refresh tokens and rate-limit counters for ten people — kilobytes. It was
    # measured at 8 MiB. `noeviction` stays: silently evicting a session logs somebody out for no
    # visible reason, and a full Redis here would mean something else is very wrong.
    #
    # `--save ""` turns off RDB snapshotting. The append-only log already persists every write,
    # and a fork-to-snapshot on a memory-starved box is exactly when the OOM killer arrives.
    mem_limit: ${MEM_REDIS:-48m}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  user-service:
    <<: *prod
    image: ${IMAGE_PREFIX:-ghcr.io/drenixbusiness/hr-performance-backend}/user-service:${IMAGE_TAG:-main}
    environment:
      DB_URL: jdbc:postgresql://postgres-identity:5432/drenix_identity
      DB_USER: identity_app
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      DRENIX_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      TLS_CERT_PATH: /etc/drenix/tls/user-service.crt
      TLS_KEY_PATH: /etc/drenix/tls/user-service.key
      TLS_CA_PATH: /etc/drenix/tls/internal-ca.crt
      # Argon2id deliberately costs memory per verification — that is what makes a stolen hash
      # expensive to crack. It also means logins allocate, so this heap is the largest of the
      # three small services.
      JAVA_TOOL_OPTIONS: >-
        -Xmx${HEAP_USER:-140m}
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1
        -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m
        -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
    volumes:
      - internal-tls:/etc/drenix/tls:ro
    networks: [drenix-internal]
    mem_limit: ${MEM_USER:-300m}
    depends_on:
      postgres-identity: { condition: service_healthy }
      tls-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9091 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      <<: *java-health

  auth-service:
    <<: *prod
    image: ${IMAGE_PREFIX:-ghcr.io/drenixbusiness/hr-performance-backend}/auth-service:${IMAGE_TAG:-main}
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USER_SERVICE_HOST: user-service
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY}
      TLS_CERT_PATH: /etc/drenix/tls/auth-service.crt
      TLS_KEY_PATH: /etc/drenix/tls/auth-service.key
      TLS_CA_PATH: /etc/drenix/tls/internal-ca.crt
      # Signs tokens and talks to Redis. It allocates almost nothing.
      JAVA_TOOL_OPTIONS: >-
        -Xmx${HEAP_AUTH:-120m}
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1
        -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m
        -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
    volumes:
      - internal-tls:/etc/drenix/tls:ro
    networks: [drenix-internal]
    mem_limit: ${MEM_AUTH:-260m}
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_started }
      tls-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      <<: *java-health

  performance-service:
    <<: *prod
    image: ${IMAGE_PREFIX:-ghcr.io/drenixbusiness/hr-performance-backend}/performance-service:${IMAGE_TAG:-main}
    environment:
      DB_URL: jdbc:postgresql://postgres-identity:5432/drenix_performance
      DB_USER: performance_app
      DB_PASSWORD: ${PERFORMANCE_DB_PASSWORD:?set PERFORMANCE_DB_PASSWORD}
      USER_SERVICE_HOST: user-service
      MONDAY_TOKEN: ${MONDAY_TOKEN:-}
      MONDAY_BOARD_ID: ${MONDAY_BOARD_ID:-}
      MONDAY_BOARD_ID_BP: ${MONDAY_BOARD_ID_BP:-}
      RC_CLIENT_ID: ${RC_CLIENT_ID:-}
      RC_CLIENT_SECRET: ${RC_CLIENT_SECRET:-}
      RC_JWT: ${RC_JWT:-}
      RC_CLIENT_ID_BP: ${RC_CLIENT_ID_BP:-}
      RC_CLIENT_SECRET_BP: ${RC_CLIENT_SECRET_BP:-}
      RC_JWT_BP: ${RC_JWT_BP:-}
      RC_DEFAULT_ENTITY: ${RC_DEFAULT_ENTITY:-JM}
      RC_ZONE: ${RC_ZONE:-Asia/Tashkent}
      SNAPSHOT_DAYS: ${SNAPSHOT_DAYS:-7}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TLS_CERT_PATH: /etc/drenix/tls/performance-service.crt
      TLS_KEY_PATH: /etc/drenix/tls/performance-service.key
      TLS_CA_PATH: /etc/drenix/tls/internal-ca.crt
      # The biggest heap of the five. A week of live RingCentral call log is eleven thousand
      # records held at once, and a monday board is a few hundred rows with every column. Cut
      # this below 160m and /activity starts throwing OutOfMemoryError on real data.
      JAVA_TOOL_OPTIONS: >-
        -Xmx${HEAP_PERFORMANCE:-200m}
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1
        -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m
        -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
    volumes:
      - internal-tls:/etc/drenix/tls:ro
    networks: [drenix-internal]
    mem_limit: ${MEM_PERFORMANCE:-380m}
    depends_on:
      postgres-identity: { condition: service_healthy }
      user-service: { condition: service_started }
      tls-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9095 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      <<: *java-health

  notification-service:
    <<: *prod
    image: ${IMAGE_PREFIX:-ghcr.io/drenixbusiness/hr-performance-backend}/notification-service:${IMAGE_TAG:-main}
    environment:
      DB_URL: jdbc:postgresql://postgres-identity:5432/drenix_notification
      DB_USER: notification_app
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      USER_SERVICE_HOST: user-service
      PERFORMANCE_SERVICE_HOST: performance-service
      RC_ZONE: ${RC_ZONE:-Asia/Tashkent}
      TLS_CERT_PATH: /etc/drenix/tls/notification-service.crt
      TLS_KEY_PATH: /etc/drenix/tls/notification-service.key
      TLS_CA_PATH: /etc/drenix/tls/internal-ca.crt
      # Polls one page of the audit log a minute and writes rows. Nothing here is large.
      JAVA_TOOL_OPTIONS: >-
        -Xmx${HEAP_NOTIFICATION:-120m}
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1
        -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m
        -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
    volumes:
      - internal-tls:/etc/drenix/tls:ro
    networks: [drenix-internal]
    mem_limit: ${MEM_NOTIFICATION:-260m}
    depends_on:
      postgres-identity: { condition: service_healthy }
      user-service: { condition: service_started }
      performance-service: { condition: service_started }
      tls-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9097 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      <<: *java-health

  # ---------------------------------------------------------------------------
  # The only service on both networks. Traefik reaches it on dokploy-network;
  # it reaches the rest on drenix-internal. No published port: nothing binds a
  # host socket, so the firewall has nothing to get wrong.
  # ---------------------------------------------------------------------------
  edge-gateway:
    <<: *prod
    image: ${IMAGE_PREFIX:-ghcr.io/drenixbusiness/hr-performance-backend}/edge-gateway:${IMAGE_TAG:-main}
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USER_SERVICE_HOST: user-service
      AUTH_SERVICE_HOST: auth-service
      PERFORMANCE_SERVICE_HOST: performance-service
      NOTIFICATION_SERVICE_HOST: notification-service
      # Same-origin in production, so the browser sends no cross-origin request at all. Still an
      # explicit allowlist: a wildcard with credentials hands any site a session.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      # Traefik terminates TLS. This speaks plain HTTP inside the Docker network.
      PUBLIC_TLS_ENABLED: "false"
      # Swagger publishes every endpoint and the permission each needs — a map of the attack
      # surface. Off unless deliberately turned on.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      TLS_CERT_PATH: /etc/drenix/tls/edge-gateway.crt
      TLS_KEY_PATH: /etc/drenix/tls/edge-gateway.key
      TLS_CA_PATH: /etc/drenix/tls/internal-ca.crt
      # PDFBox builds the whole monthly report in memory before a byte reaches the browser —
      # pages, fonts, images and the assembled document at once.
      JAVA_TOOL_OPTIONS: >-
        -Xmx${HEAP_GATEWAY:-180m}
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1
        -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m
        -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
    volumes:
      - internal-tls:/etc/drenix/tls:ro
    networks: [drenix-internal, dokploy-network]
    mem_limit: ${MEM_GATEWAY:-340m}
    depends_on:
      auth-service: { condition: service_started }
      performance-service: { condition: service_started }
      notification-service: { condition: service_started }
      tls-init: { condition: service_completed_successfully }
    expose: ["8443"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      <<: *java-health

    # If you would rather write the Traefik labels here than use the Dokploy Domain form,
    # uncomment these and skip the UI step. Check the certresolver name against your Traefik
    # configuration first — Dokploy's is usually `letsencrypt`, and a wrong name fails silently
    # with a self-signed certificate.
    #
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=dokploy-network
    #   - traefik.http.routers.drenix-api.rule=Host(`performance.drenix.uz`) && PathPrefix(`/api`)
    #   - traefik.http.routers.drenix-api.entrypoints=websecure
    #   - traefik.http.routers.drenix-api.tls.certresolver=letsencrypt
    #   # Higher than the frontend's Host()-only router, so /api never falls through to the SPA.
    #   - traefik.http.routers.drenix-api.priority=100
    #   - traefik.http.services.drenix-api.loadbalancer.server.port=8443
    #   # NO StripPrefix middleware. The backend serves /api itself.
