syntax = "proto3";

package drenix.identity.v1;

import "drenix/identity/v1/common.proto";
import "drenix/identity/v1/user.proto";   // Empty

option java_package = "uz.drenix.identity.grpc.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Notifications.
//
// Two kinds, from two very different places.
//
// ACTIVITY is a mirror of the audit log: somebody created an account, changed
// a role, reset a password. It is generated by polling user-service rather
// than by user-service pushing, so that a notification outage can never fail
// the action it is reporting on.
//
// PERFORMANCE is generated once a shift has finished: whoever missed the
// standard, told to the lead of their company and to nobody else.
//
// Notifications are per person. A row exists for each recipient, so read
// state is theirs alone and there is no shared inbox to disagree about.
// ---------------------------------------------------------------------------

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  // Somebody did something: the audit log, addressed to the people who
  // supervise the person who did it.
  NOTIFICATION_KIND_ACTIVITY = 1;
  // Somebody missed the daily standard for a finished shift.
  NOTIFICATION_KIND_PERFORMANCE = 2;
}

enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;     // it happened, nothing is wrong
  NOTIFICATION_SEVERITY_WARNING = 2;  // somebody is short of a target
  NOTIFICATION_SEVERITY_ALERT = 3;    // an action was denied or failed
}

message Notification {
  int64 id = 1;
  NotificationKind kind = 2;
  NotificationSeverity severity = 3;
  // One line, already written for a human. Clients display it as-is rather
  // than rebuilding a sentence out of the fields below.
  string title = 4;
  string body = 5;
  // The person the notification is *about*, when there is one — the recruiter
  // who missed the standard, or whoever performed the action. Empty otherwise.
  string subject_user_id = 6;
  string subject_name = 7;
  // ISO-8601. When the thing being reported happened, not when the row was
  // written: the performance check runs hours after the shift it judges.
  string occurred_at = 8;
  string created_at = 9;
  string read_at = 10;             // empty while unread
  // For ACTIVITY, the audit action (user.create, auth.login). For PERFORMANCE,
  // the date of the shift. Lets a client group or filter without parsing text.
  string reference = 11;
}

message ListNotificationsRequest {
  // The caller is taken from the token, never from this message: nobody reads
  // somebody else's notifications, not even an administrator.
  PageRequest page = 1;
  bool unread_only = 2;
  NotificationKind kind = 3;       // optional filter
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  PageInfo page = 2;
  int32 unread_count = 3;          // across everything, not just this page
}

message UnreadCountResponse {
  int32 unread = 1;
}

message MarkReadRequest {
  int64 id = 1;
}

message MarkReadResponse {
  int32 unread = 1;                // what is left, so a badge can be updated
}

service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc UnreadCount(Empty) returns (UnreadCountResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc MarkAllRead(Empty) returns (MarkReadResponse);
}

// ---------------------------------------------------------------------------
// The one thing that is pushed rather than polled.
//
// Everything else this service reports on leaves a trace somewhere it can go
// and read — an audit entry, a finished shift. Generating a report leaves
// none: it is a thing somebody did with a button, and there is nothing to poll
// for it afterwards. So this one arrives as a call.
//
// Deliberately narrow. Not a general "write me a notification" endpoint, which
// would turn every service into a publisher and this one into a queue.
// ---------------------------------------------------------------------------

message ReportGeneratedRequest {
  // What the report covered, for the notification text. YYYY-MM.
  string month = 1;
  // How many people it covered.
  int32 subjects = 2;
  // The file it produced, for the notification to name.
  string filename = 3;
}

service ReportEventService {
  // Records "your report is ready" for the caller, and for nobody else.
  rpc ReportGenerated(ReportGeneratedRequest) returns (Empty);
}
