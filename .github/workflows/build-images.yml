# Build the five service images here, push them to GHCR, then ask Dokploy to pull.
#
# WHY THIS EXISTS. Building this repository means compiling five Java modules with Maven, and
# Maven alone wants most of a gigabyte before javac starts. On the production server — 4 CPUs and
# 2 GB of RAM shared with Dokploy and the running application — that build pinned the CPU at 92%
# and pushed swap to 100%. The build is not part of serving traffic and has no business happening
# on the machine that serves it.
#
# GitHub's runners are free for a private repository within the monthly minutes, have 4 CPUs and
# 16 GB, and throw the machine away afterwards. The server's job becomes `docker pull`.
#
# The trade: the server no longer needs a build toolchain, a Maven cache, or the ~2 GB of layers
# a build leaves behind. Deployments also stop taking fifteen minutes.
name: build images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Compile and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build
        run: mvn -B -ntp verify
      - name: Check the compose files
        run: |
          cat > .env <<'EOF'
          IDENTITY_DB_PASSWORD=ci
          NOTIFICATION_DB_PASSWORD=ci
          PERFORMANCE_DB_PASSWORD=ci
          REDIS_PASSWORD=ci
          BOOTSTRAP_ADMIN_PASSWORD=ci-placeholder-12
          AUTH_SIGNING_KEY={}
          ALLOWED_ORIGINS=https://performance.drenix.uz
          EOF
          docker network create dokploy-network >/dev/null
          docker compose --env-file .env -f deploy/docker-compose.dokploy.yml config >/dev/null
          docker compose --env-file .env -f deploy/docker-compose.registry.yml config >/dev/null
          rm -f .env
      - name: Refuse a committed secret
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and ROTATE every credential in it."
            exit 1
          fi
          if git ls-files | grep -qE '^deploy/tls/.*\.key$'; then
            echo "::error::private keys are tracked by git. Remove them and regenerate."
            exit 1
          fi

  images:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # to push to ghcr.io
    strategy:
      # Five independent images. Building them together on one runner would serialise five Maven
      # runs; `fail-fast` stops the other four the moment one breaks, so a broken build does not
      # burn twenty minutes proving it four more times.
      fail-fast: true
      matrix:
        module:
          - user-service
          - auth-service
          - performance-service
          - notification-service
          - edge-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided by Actions; no secret to manage

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: MODULE=${{ matrix.module }}
          push: true
          # Two tags: `main` is what the server pulls, the commit SHA is what lets you say with
          # certainty which build is running and roll back to a specific one.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.module }}:main
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.module }}:${{ github.sha }}
          # A registry-backed cache, so the second build reuses the first's Maven layer instead
          # of downloading every dependency again.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.module }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.module }}:buildcache,mode=max
          provenance: false

  deploy:
    name: Deploy via Dokploy
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://performance.drenix.uz
    steps:
      - name: Trigger the Dokploy deployment
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
                   --max-time 30 "${{ secrets.DOKPLOY_WEBHOOK_URL }}")
          echo "Dokploy answered $code"
          head -c 500 /tmp/body || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Dokploy did not accept the deployment request."
            exit 1
          fi

      # Pulling five images and restarting is a minute or two, not the fifteen a source build took.
      - name: Wait for the deployment to land
        run: sleep 45

      - name: Verify the public endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://performance.drenix.uz/api/health | grep -q '"UP"'; then
              echo "public health check passed"
              exit 0
            fi
            echo "attempt $i: not answering yet"
            sleep 15
          done
          echo "::error::https://performance.drenix.uz/api/health never answered."
          echo "::error::Read the deployment log in Dokploy."
          exit 1
